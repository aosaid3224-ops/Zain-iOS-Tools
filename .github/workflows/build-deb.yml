name: Build ANUBISCrack DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ANUBISCrack/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git theos

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          cd ANUBISCrack
          make clean
          make package
          ls -la packages/

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANUBISCrack-DEB
          path: ANUBISCrack/packages/*.deb
          retention-days: 30
