name: Build NetWatch Independent Tweak
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-netwatch:
    name: Build NetWatch v1.0
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -f "$HOME/theos/makefiles/common.mk"
      - name: Setup dependencies
        run: brew install dpkg ldid
      - name: Build NetWatch
        run: |
          cd LoaderRecon
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - name: Verify NetWatch package
        run: |
          set -e
          DEB=$(find LoaderRecon/packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$DEB"
          dpkg-deb -f "$DEB" Package Name Version Architecture
          test "$(dpkg-deb -f "$DEB" Package)" = "com.sys.netwatch"
          test "$(dpkg-deb -f "$DEB" Version)" = "1.4"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
      - name: Upload NetWatch artifact
        uses: actions/upload-artifact@v4
        with:
          name: netwatch-1.0
          path: LoaderRecon/packages/*.deb
          if-no-files-found: error
