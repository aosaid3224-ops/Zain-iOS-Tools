name: Build GameForge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl dpkg libssl-dev libplist-dev libplist++-dev libplist-utils
      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-v3
      - name: Build ldid
        run: |
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid -j$(nproc)
          sudo cp /tmp/ldid/ldid /usr/local/bin/ldid
      - name: Setup Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cp -a /tmp/sdks/. "$HOME/theos/sdks/"
          cd "$HOME/theos/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk iPhoneOS14.5.sdk
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Setup iOS toolchain
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/swift.tar.gz https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz
          tar -xzf /tmp/swift.tar.gz -C /tmp
          rm -rf "$HOME/theos/toolchain/linux/iphone"
          mkdir -p "$HOME/theos/toolchain/linux"
          cp -a /tmp/swift-6.0.3-RELEASE-ubuntu24.04/usr "$HOME/theos/toolchain/linux/iphone"
      - name: ld wrapper
        run: |
          python3 - <<'PY'
          import os
          bin = os.path.expanduser('~/theos/toolchain/linux/iphone/bin')
          wrapper = '#!/bin/sh\necho "=== ld raw: $@" >> /tmp/ldargs.log\nout=""\nhave_ver=0\nfor a in "$@"; do\n  case "$a" in\n    -platform_version) have_ver=1; out="$out $a";;\n    -iphoneos_version_min=*|-ios_version_min=*|-miphoneos-version-min=*) v="${a#*=}"; out="$out -platform_version ios $v 16.5"; have_ver=1;;\n    *) out="$out $a";;\n  esac\ndone\nif [ $have_ver -eq 0 ]; then out="$out -platform_version ios 15.0 16.5"; fi\necho "=== ld lld: $out" >> /tmp/ldargs.log\nexec "$(dirname "$0")/ld64.lld" $out\n'
          open(os.path.join(bin, 'ld'), 'w').write(wrapper)
          os.chmod(os.path.join(bin, 'ld'), 0o755)
          print('wrapper written:', os.path.join(bin, 'ld'))
          PY
          

      - name: Build
        run: |
          cd GameForge
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 messages=yes ARCHS=arm64
          rc=$?
          echo "---- ld args dump ----"
          cat /tmp/ldargs.log 2>/dev/null || echo "no ldargs"
          exit $rc
      - name: Verify
        run: |
          set -e
          DEB=$(find GameForge/packages -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.nw.gameforge"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: gameforge-1.0
          path: GameForge/packages/*.deb
          if-no-files-found: error
