name: Build DeltaGuard iOS Native DEB

on:
  workflow_dispatch:

concurrency:
  group: deltaguard-dev-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
jobs:
  build-deltaguard-ios:
    name: Build DeltaGuardIOS native app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            DeltaGuardIOS
          sparse-checkout-cone-mode: true
      - name: Install dependencies
        run: brew install dpkg ldid
      - name: Read package version
        id: package-version
        run: |
          VERSION=$(awk -F ': ' '$1 == "Version" { print $2; exit }' DeltaGuardIOS/control)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
      - name: Build privileged Rootless helper
        run: |
          cd DeltaGuardIOS
          mkdir -p layout/usr/libexec
          xcrun clang -target arm64-apple-ios15.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -O2 Helper/deltaguard_helper.c -o layout/usr/libexec/deltaguard_helper
          chmod 755 layout/usr/libexec/deltaguard_helper
          ldid -S layout/usr/libexec/deltaguard_helper
      - name: Build package
        run: |
          cd DeltaGuardIOS
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/prerm
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          DEB_FILE=$(ls -t packages/*.deb | head -1)
          dpkg-deb -f "$DEB_FILE" Package Version Architecture
          test "$(dpkg-deb -f "$DEB_FILE" Package)" = "com.aosaid.deltaguard"
          test "$(dpkg-deb -f "$DEB_FILE" Version)" = "${{ steps.package-version.outputs.version }}"
          test "$(dpkg-deb -f "$DEB_FILE" Architecture)" = "iphoneos-arm64"
      - name: Upload verified DEB
        uses: actions/upload-artifact@v4
        with:
          name: deltaguard-ios-${{ steps.package-version.outputs.version }}
          path: DeltaGuardIOS/packages/*.deb
          if-no-files-found: error
