name: Build Apps and Prepare Dev Packages
permissions:
  contents: write

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout repo-dev
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo-dev
          token: ${{ secrets.PAT }}
          path: repo-dev

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Setup dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Build Crack Lab
        run: |
          cd source/CrackLab
          make clean
          make package
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: cracklab-development-packages
          path: |
            source/CrackLab/packages/*.deb
            source/scripts/generate-repo.py
          if-no-files-found: error

      - name: Deploy Crack Lab to repo-dev
        run: |
          set -e
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          mkdir -p repo-dev/pool/main/iphoneos-arm64
          cp source/CrackLab/packages/*.deb repo-dev/pool/main/iphoneos-arm64/
          mkdir -p repo-dev/scripts
          cp source/scripts/generate-repo.py repo-dev/scripts/
          python3 repo-dev/scripts/generate-repo.py repo-dev --dev
          python3 source/scripts/validate-repo.py repo-dev
          cd repo-dev
          git add -A
          if git diff --cached --quiet; then
            echo "repo-dev is already synchronized"
          else
            version=$(awk '$1 == "Version:" { print $2; exit }' ../source/CrackLab/control)
            git commit -m "Crack Lab v${version} — dev build"
            git push origin main
          fi
