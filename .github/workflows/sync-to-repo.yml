name: Build Apps and Prepare Dev Packages
permissions:
  contents: read

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Setup dependencies
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install dpkg ldid

      - name: Fix package script permissions
        run: |
          chmod +x source/IPAInstallerPro/layout/DEBIAN/postinst 2>/dev/null || true
          chmod +x source/IPAInstallerPro/layout/DEBIAN/prerm 2>/dev/null || true

      - name: Build IPA Installer Pro
        run: |
          cd source/IPAInstallerPro
          make clean
          make package

      - name: Build Crack Lab
        run: |
          cd source/CrackLab
          make clean
          make package
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: cracklab-development-packages
          path: |
            source/IPAInstallerPro/packages/*.deb
            source/CrackLab/packages/*.deb
            source/scripts/generate-repo.py
          if-no-files-found: error
