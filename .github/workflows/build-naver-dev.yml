name: Build NaverSeriesBypass and Sync to Dev Repo

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  NAVER_VERSION: 3.3.4

jobs:
  build-naver-dev:
    name: Build NaverSeriesBypass (Dev)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/package/deb.mk"

      - name: Checkout development repository
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo-dev
          token: ${{ secrets.PAT }}
          path: repo-dev

      - name: Build NaverSeriesBypass
        run: |
          cd NaverSeriesBypass
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/postrm 2>/dev/null || true
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          DEB_FILE=$(ls -t packages/*.deb | head -1)
          test -n "$DEB_FILE"
          dpkg-deb -f "$DEB_FILE" Package Version Architecture
          test "$(dpkg-deb -f "$DEB_FILE" Package)" = "com.aosaid.naverseriesbypass"
          test "$(dpkg-deb -f "$DEB_FILE" Version)" = "$NAVER_VERSION"
          test "$(dpkg-deb -f "$DEB_FILE" Architecture)" = "iphoneos-arm64"

      - name: Publish verified package to development repository
        run: |
          set -euo pipefail
          mkdir -p repo-dev/pool/main/iphoneos-arm64
          rm -f repo-dev/pool/main/iphoneos-arm64/com.aosaid.naverseriesbypass_*.deb
          cp NaverSeriesBypass/packages/*.deb repo-dev/pool/main/iphoneos-arm64/
          mkdir -p repo-dev/scripts
          cp scripts/generate-repo.py repo-dev/scripts/
          python3 repo-dev/scripts/generate-repo.py repo-dev --dev
          cd repo-dev
          git config user.email 'ci@github.com'
          git config user.name 'GitHub CI'
          git add -A
          git commit -m "Publish NaverSeriesBypass ${NAVER_VERSION} to development repo" || true
          git push origin main

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: naverseriesbypass-${{ env.NAVER_VERSION }}
          path: NaverSeriesBypass/packages/*.deb
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          echo "Verified artifact created and published to repo-dev"
          echo "Package: com.aosaid.naverseriesbypass"
          echo "Version: $NAVER_VERSION"
