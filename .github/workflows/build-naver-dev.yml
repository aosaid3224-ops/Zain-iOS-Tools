name: Build NaverSeriesBypass and Sync to Dev Repo

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build-naver-dev:
    name: Build NaverSeriesBypass (Dev)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout repo-dev
        uses: actions/checkout@v4
        with:
          repository: aosaid3224-ops/repo-dev
          token: ${{ secrets.PAT }}
          path: repo-dev

      - name: Install dependencies
        run: brew install dpkg ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/package/deb.mk"

      - name: Build NaverSeriesBypass
        run: |
          cd NaverSeriesBypass
          chmod +x layout/DEBIAN/postinst layout/DEBIAN/postrm 2>/dev/null || true
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          DEB_FILE=$(ls -t packages/*.deb | head -1)
          test -n "$DEB_FILE"
          dpkg-deb -f "$DEB_FILE" Package Version Architecture
          test "$(dpkg-deb -f "$DEB_FILE" Package)" = "com.aosaid.naverseriesbypass"
          test "$(dpkg-deb -f "$DEB_FILE" Version)" = "3.2.0"
          test "$(dpkg-deb -f "$DEB_FILE" Architecture)" = "iphoneos-arm64"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: naverseriesbypass-3.2.0
          path: NaverSeriesBypass/packages/*.deb
          if-no-files-found: error

      - name: Publish verified package to repo-dev
        run: |
          set -euo pipefail
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub CI"
          mkdir -p repo-dev/pool/main/iphoneos-arm64
          cp NaverSeriesBypass/packages/*.deb repo-dev/pool/main/iphoneos-arm64/
          cp scripts/generate-repo.py repo-dev/scripts/generate-repo.py
          python3 scripts/generate-repo.py repo-dev --dev
          python3 scripts/validate-repo.py repo-dev
          cd repo-dev
          git add -A
          if git diff --cached --quiet; then
            echo "repo-dev is already synchronized"
          else
            git commit -m "NaverSeriesBypass v3.2.0 — dev build"
            git push origin main
          fi

      - name: Summary
        if: always()
        run: |
          echo "Dev repo: https://aosaid3224-ops.github.io/repo-dev/"
          echo "Package: com.aosaid.naverseriesbypass"
          echo "Version: 3.2.0"
